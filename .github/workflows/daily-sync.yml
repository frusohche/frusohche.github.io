name: Daily activity sync

on:
  schedule:
    # 11 PM Chicago is 04:00 UTC in summer (CDT) and 05:00 UTC in winter (CST).
    # Both run; the script skips whichever one isn't 11 PM local.
    - cron: '5 4 * * *'
    - cron: '5 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync GitHub activity
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ONLY_AT_HOUR: ${{ github.event_name == 'schedule' && '23' || '' }}
        run: node scripts/sync-activity.mjs

      - name: Commit changes
        run: |
          git diff --quiet -- activity.json && exit 0
          git config user.name "ambition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json
          git commit -m "Daily activity sync"
          git push
